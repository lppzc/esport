# 自动增量更新电竞赛程数据
#
# 流程: 定时爬取最新数据 -> 合并进 data_store(增量 + 保留官网已下架
#       的历史比赛) -> 重建前端 esports.json -> 有变更则提交推送。
#
# 手动触发: GitHub 仓库页 Actions -> Auto Update Data -> Run workflow
#
# 关于频率: GitHub 的 schedule 是"请求"不是"契约"。本仓库实测
# (2026-09-01 ~ 2026-10-01) 声明 48 次/天，实际 5~6 次/天，
# 平均间隔约 3.9 小时，且排队延迟恒为 0(说明事件根本没被发出)。
# 不要基于 cron 声明值设计时效性依赖。
name: Auto Update Data

on:
  schedule:
    # UTC 时间。刻意避开 :00/:30 —— GitHub 官方说明 schedule 在高负载时会被
    # 延迟，而"每个小时的开始"正是官方点名的高峰时段，落在高峰的 cron 更容易
    # 被延迟甚至丢弃。错开到 :07/:37 以降低被降级的概率。
    - cron: '7,37 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: auto-update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          pip install 'requests>=2.32,<3'
          # 仅文档/类型检查需要 node 依赖，构建数据脚本零依赖
          # npm ci --ignore-scripts --prefix web  # 如需重建 dist 再启用

      # ---- 三个数据源彼此独立 ----
      # 每个爬虫自己重试 3 次；最终失败只跳过该数据源，保留 data_store 里已有的
      # 旧数据，不影响其它数据源、也不影响后面的合并/构建/提交。
      # 背景: 2026-08-25 / 08-27 / 09-16 三次失败都是 "Crawl DFPL" 单步失败后，
      # 后面的 Crawl CS / Merge / Verify / Commit 全部被 skipped，整轮没有任何更新。
      # DFPL 的直接原因是瞬时网络超时:
      #   requests.exceptions.ConnectionError: HTTPSConnectionPool(
      #     host='df.timi-esports.qq.com', port=443): Read timed out.
      - name: Crawl VCT (VALORANT)
        continue-on-error: true
        run: |
          set +e
          for i in 1 2 3; do
            python vct_crawler.py --out-dir snapshots/vct && exit 0
            echo "::warning::VCT 第 $i 次抓取失败，20s 后重试"
            sleep 20
          done
          echo "::warning::VCT 连续 3 次失败，本轮跳过 VCT（保留 data_store 旧数据）"
          exit 0

      - name: Crawl DFPL (Delta Force)
        continue-on-error: true
        run: |
          set +e
          for i in 1 2 3; do
            python dfpl_crawler.py --all-seasons --out-dir snapshots/dfpl && exit 0
            echo "::warning::DFPL 第 $i 次抓取失败，20s 后重试"
            sleep 20
          done
          echo "::warning::DFPL 连续 3 次失败，本轮跳过 DFPL（保留 data_store 旧数据）"
          exit 0

      - name: Crawl CS (Counter-Strike)
        continue-on-error: true
        run: |
          set +e
          for i in 1 2 3; do
            python cs_crawler.py --out-dir snapshots/cs && exit 0
            echo "::warning::CS 第 $i 次抓取失败，20s 后重试"
            sleep 20
          done
          echo "::warning::CS 连续 3 次失败，本轮跳过 CS（保留 data_store 旧数据）"
          exit 0

      # 合并层本身容忍快照缺失（update.mjs 会打印"无新快照，跳过合并"）
      - name: Merge incremental updates
        run: |
          node scripts/update.mjs
          node web/scripts/build-data.mjs

      - name: Verify data integrity
        run: |
          node -e "
          const d = require('./web/src/data/esports.json');
          if (!d.matches.length || !d.teams.length) throw new Error('数据异常: 空 matches/teams');
          if (d.matches.length < 900) throw new Error('数据异常: 比赛数骤降 ' + d.matches.length);
          console.log('数据完整: ' + d.matches.length + ' 场比赛 / ' + d.teams.length + ' 支战队');
          "

      - name: Commit & push if changed
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_store web/src/data/esports.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(data): 自动增量更新 $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git push && exit 0
            echo "::warning::push 第 $i 次失败，15s 后重试"
            sleep 15
          done
          echo "::error::push 连续 3 次失败，本轮数据未落库"
          exit 1
